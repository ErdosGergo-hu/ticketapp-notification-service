databaseChangeLog:
  - changeSet:
      id: 001-create-processed-kafka-messages
      author: janos
      changes:
        - createTable:
            tableName: processed_kafka_messages
            columns:
              - column:
                  name: message_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false